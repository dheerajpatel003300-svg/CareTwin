services:
  postgres:
    image: postgres:16-alpine
    container_name: caretwin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caretwin
      POSTGRES_PASSWORD: caretwin
      POSTGRES_DB: caretwin
    ports:
      - "5432:5432"
    volumes:
      - caretwin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caretwin -d caretwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: caretwin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caretwin_pg_data:
